name: gitown
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gitown
      POSTGRES_DB: gitown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitown -d gitown"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgres://gitown:${POSTGRES_PASSWORD}@postgres:5432/gitown?sslmode=disable
      GITOWN_ORIGIN: http://localhost:3000
      GITOWN_GIT_URL: http://localhost:8080/git
      GITOWN_ALLOW_SIGNUP: ${GITOWN_ALLOW_SIGNUP:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - repositories:/data/repositories
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
  repositories:
