                  items: { $ref: "#/components/schemas/IssueTemplate" }
      responses:
        "200":
          description: Updated templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueTemplate" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List up to 100 issues visible to repository readers
      responses:
        "200":
          description: Issues, newest first
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Issue" } }
    post:
      summary: Create an issue with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody: { $ref: "#/components/requestBodies/Content" }
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
  /repos/{owner}/{repo}/issues/{number}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    patch:
      summary: Close or reopen an issue with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [open, closed] }
  /repos/{owner}/{repo}/issues/{number}/dependencies:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read what blocks this issue and what this issue blocks
      responses:
        "200":
          description: Issue dependency links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueDependencies" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace up to 20 blockers; rejects cycles and cross-repository links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_by]
              properties:
                blocked_by:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated dependency links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueDependencies" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/assignees:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: List assigned and eligible repository members
      responses:
        "200":
          description: Issue assignment choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueAssignees" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace issue assignees with up to 10 repository members
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200":
          description: Updated assignment choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueAssignees" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/subscription:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: Read whether the current user follows an issue
      responses:
        "200":
          description: Subscription state; false for anonymous readers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Follow or unfollow an issue
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscribed]
              properties:
                subscribed: { type: boolean }
      responses:
        "200":
          description: Saved subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/milestones:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: List up to 100 milestones with open and closed issue counts
      responses:
        "200":
          description: Milestones, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
    post:
      summary: Create a milestone with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                due_date: { type: string, format: date }
      responses:
        "201":
          description: Created milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/milestones/{id}:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Replace milestone details or close and reopen it
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, state]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                state: { type: string, enum: [open, closed] }
                due_date:
                  {
                    type: string,
                    format: date,
                    description: Empty string clears the due date,
                  }
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/milestone:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: Read the milestone assigned to an issue
      responses:
        "200":
          description: Assigned milestone or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestone:
                    oneOf:
                      - { $ref: "#/components/schemas/Milestone" }
                      - { type: "null" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Assign or clear an issue milestone with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestone_id]
              properties:
                milestone_id: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: Updated issue milestone }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/board:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: List up to 100 issues on the repository planning board
      responses:
        "200":
          description: Board items, newest issue first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardItem" }
  /repos/{owner}/{repo}/issues/{number}/board:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    put:
      summary: Move an issue between planning columns; Done closes it
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [todo, progress, done] }
      responses:
        "200":
          description: Saved board status and issue state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [todo, progress, done] }
                  state: { type: string, enum: [open, closed] }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/comments:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List up to 200 issue comments visible to repository readers
      responses:
        "200":
          description: Chronological issue discussion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueComment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a comment as an authenticated repository reader
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueComment" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/labels:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List repository labels
      responses:
        "200":
          description: Labels ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
    post:
      summary: Create a repository label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                color: { type: string, pattern: "^#?[0-9a-fA-F]{6}$" }
                description: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/labels/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      summary: Delete a repository label and its issue assignments
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/labels:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List labels assigned to an issue
      responses:
        "200":
          description: Assigned labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
    post:
      summary: Assign a label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_id]
              properties:
                label_id: { type: string, format: uuid }
      responses:
        "200":
          description: Assigned label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/labels/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
        {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      summary: Remove an assigned issue label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List up to 100 pull requests
      responses:
        "200":
          description: Pull requests, newest first
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Pull" } }
    post:
      summary: Open a same-repository pull request (owner only)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, base_branch, head_branch]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                base_branch: { type: string }
                head_branch: { type: string }
      responses:
        "201":
          description: Pull request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read current pull request, diff, and mergeability
      responses:
        "200":
          description: Comparison snapshot; send its SHAs when merging
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull: { $ref: "#/components/schemas/Pull" }
                  head_sha: { type: string }
                  base_sha: { type: string }
                  diff: { type: string }
                  diff_error: { type: string }
                  mergeable: { type: boolean }
                  can_review: { type: boolean }
    patch:
      summary: Close or reopen a pull request with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Updated pull request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/merge:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    post:
      summary: Merge, squash, or rebase a ready Unite request, or resume a persisted merge intent
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [head_sha, base_sha]
              properties:
                head_sha: { type: string }
                base_sha: { type: string }
                method: { type: string, enum: [merge, squash, rebase] }
                delete_branch: { type: boolean }
      responses:
        "200":
          description: Merged pull request; retries of already merged requests are idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/subscription:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read whether the current user follows a Unite request
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Follow or unfollow a Unite request
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscribed]
              properties:
                subscribed: { type: boolean }
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/comments:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List up to 200 pull-request comments visible to repository readers
      responses:
        "200":
          description: Chronological pull-request discussion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PullComment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a comment as an authenticated repository reader
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullComment" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/reviews:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List formal reviews and whether each targets an outdated head
      responses:
        "200":
          description: Chronological formal reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    state:
                      {
                        type: string,
                        enum: [approved, changes_requested, commented],
                      }
                    body: { type: string }
                    reviewer: { type: string }
                    head_sha: { type: string }
                    stale: { type: boolean }
                    created_at: { type: string, format: date-time }
    post:
      summary: Submit a commit-bound formal review with write permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, body, head_sha]
              properties:
                state:
                  {
                    type: string,
                    enum: [approved, changes_requested, commented],
                  }
                body: { type: string, maxLength: 10000 }
                head_sha: { type: string, minLength: 40, maxLength: 40 }
      responses:
        "201": { description: Formal review submitted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: gitown_session }
    token: { type: http, scheme: bearer, description: "Personal access token (gtn_...) where an endpoint accepts one" }
  parameters:
    Origin:
      {
        name: Origin,
        in: header,
        required: true,
        schema: { type: string },
        description: Exact configured frontend origin,
      }
    Owner: { name: owner, in: path, required: true, schema: { type: string } }
    Repo: { name: repo, in: path, required: true, schema: { type: string } }
    Number:
      {
        name: number,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
  requestBodies:
    Content:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              body: { type: string, maxLength: 20000 }
  responses:
    OK:
      description: Operation completed
      content:
        application/json:
          schema: { type: object, properties: { ok: { type: boolean } } }
    Session:
      description: User and new session cookie
      headers:
        Set-Cookie:
          {
            schema: { type: string },
            description: HttpOnly,
            SameSite=Lax; Secure for HTTPS origins,
          }
      content:
        application/json:
          schema:
            {
              type: object,
              properties: { user: { $ref: "#/components/schemas/User" } },
            }
    Error:
      description: Safe error with a stable code; all endpoints may also return 400, 401, 403, or 500
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    BuilderSearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BuilderResult" }
        has_more: { type: boolean }
    BuilderResult:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        location: { type: string }
        followers: { type: integer, minimum: 0 }
        repositories: { type: integer, minimum: 0 }
        open_to_collaborators: { type: boolean }
    WorkSearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [issue, unite] }
              owner: { type: string }
              repository: { type: string }
              number: { type: integer }
              title: { type: string }
              preview: { type: string }
              state: { type: string }
        has_more: { type: boolean }
    RepositorySearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        has_more: { type: boolean }
    SparkState:
      type: object
      required: [count, sparked]
      properties:
        count: { type: integer, minimum: 0 }
        sparked: { type: boolean }
    TopicState:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    Repository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, private] }
        default_branch: { type: string }
        created_at: { type: string, format: date-time }
        can_write: { type: boolean }
        can_triage: { type: boolean }
        can_manage: { type: boolean }
        can_maintain: { type: boolean }
        can_comment: { type: boolean }
        archived: { type: boolean }
        role:
          type: string
          enum: [owner, maintain, write, triage, read]
        clone_url: { type: string, format: uri }
    RepositoryRole:
      type: string
      enum: [maintain, write, triage, read]
    RepositoryMember:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        created_at: { type: string, format: date-time }
    BranchRule:
      type: object
      properties:
        branch: { type: string }
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        block_changes_requested: { type: boolean }
        require_unite: { type: boolean }
        require_resolved: { type: boolean }
        require_up_to_date: { type: boolean }
        restrict_push: { type: boolean }
        require_signed: { type: boolean }
        require_maintainer_approval: { type: boolean }
        required_checks: { type: array, items: { type: string } }
        required_reviewers: { type: array, items: { type: string } }
        allow_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        updated_at: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        repository: { type: string }
        email: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        status: { type: string, enum: [pending, accepted, declined, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accept_url: { type: string, format: uri, description: Present only when an email-only invitation is created }
    DeletedRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        deleted_at: { type: string, format: date-time }
        purge_after: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: ["repo:read", "repo:write"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BrowserSession:
      type: object
      properties:
        id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PublicRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    Profile:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        location: { type: string }
        skills: { type: string, maxLength: 200 }
        availability: { type: string, maxLength: 200 }
        open_to_collaborators: { type: boolean }
        contributions:
          type: object
          properties:
            merged_unites: { type: integer, minimum: 0 }
            approvals: { type: integer, minimum: 0 }
            closed_issues: { type: integer, minimum: 0 }
            public_repositories: { type: integer, minimum: 0 }
        badges:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
        followed: { type: boolean }
        showcase:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
        repositories:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
    IssueTemplate:
      type: object
      required: [name, title, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        kind: { type: string, enum: [bug, feature, custom] }
    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        author: { type: string }
        created_at: { type: string, format: date-time }
    IssueComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
    PublicUser:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
    LinkedIssue:
      type: object
      properties:
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
    IssueDependencies:
      type: object
      properties:
        blocked_by:
          type: array
          items: { $ref: "#/components/schemas/LinkedIssue" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/LinkedIssue" }
    IssueAssignees:
      type: object
      properties:
        assigned:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
        available:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
    IssueSubscription:
      type: object
      properties:
        subscribed: { type: boolean }
    FeedEvent:
      type: object
      properties:
        kind:
          {
            type: string,
            enum:
              [
                repository_created,
                repository_sparked,
                issue_opened,
                unite_opened,
              ],
          }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind:
          {
            type: string,
            enum:
              [
                issue_comment,
                issue_closed,
                issue_reopened,
                pull_comment,
                pull_review,
                pull_closed,
                pull_reopened,
                pull_merged,
              ],
          }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        issue: { type: [integer, "null"] }
        pull: { type: [integer, "null"] }
        title: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    Milestone:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        state: { type: string, enum: [open, closed] }
        due_date: { type: [string, "null"], format: date }
        open_issues: { type: integer }
        closed_issues: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardItem:
      type: object
      properties:
        issue_id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
        status: { type: string, enum: [todo, progress, done] }
        author: { type: string }
    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^[0-9a-f]{6}$" }
        description: { type: string }
        created_at: { type: string, format: date-time }
    Pull:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed, merging, merged] }
        author: { type: string }
        created_at: { type: string, format: date-time }
        base_branch: { type: string }
        head_branch: { type: string }
        merge_sha: { type: [string, "null"] }
        branch_deleted: { type: boolean, description: Present in a merge response when source-branch deletion was requested }
        branch_delete_error: { type: string, description: Why the source branch was kept }
    PullComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
