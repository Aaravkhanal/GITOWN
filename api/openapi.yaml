      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, body, head_sha]
              properties:
                state:
                  {
                    type: string,
                    enum: [approved, changes_requested, commented],
                  }
                body: { type: string, maxLength: 10000 }
                head_sha: { type: string, minLength: 40, maxLength: 40 }
      responses:
        "201": { description: Formal review submitted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: gitown_session }
  parameters:
    Origin:
      {
        name: Origin,
        in: header,
        required: true,
        schema: { type: string },
        description: Exact configured frontend origin,
      }
    Owner: { name: owner, in: path, required: true, schema: { type: string } }
    Repo: { name: repo, in: path, required: true, schema: { type: string } }
    Number:
      {
        name: number,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
  requestBodies:
    Content:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              body: { type: string, maxLength: 20000 }
  responses:
    OK:
      description: Operation completed
      content:
        application/json:
          schema: { type: object, properties: { ok: { type: boolean } } }
    Session:
      description: User and new session cookie
      headers:
        Set-Cookie:
          {
            schema: { type: string },
            description: HttpOnly,
            SameSite=Lax; Secure for HTTPS origins,
          }
      content:
        application/json:
          schema:
            {
              type: object,
              properties: { user: { $ref: "#/components/schemas/User" } },
            }
    Error:
      description: Safe error with a stable code; all endpoints may also return 400, 401, 403, or 500
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    RepositorySearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        has_more: { type: boolean }
    SparkState:
      type: object
      required: [count, sparked]
      properties:
        count: { type: integer, minimum: 0 }
        sparked: { type: boolean }
    TopicState:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    Repository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, private] }
        default_branch: { type: string }
        created_at: { type: string, format: date-time }
        can_write: { type: boolean }
        can_triage: { type: boolean }
        can_manage: { type: boolean }
        can_comment: { type: boolean }
        archived: { type: boolean }
        role:
          type: string
          enum: [owner, maintain, write, triage, read]
        clone_url: { type: string, format: uri }
    RepositoryRole:
      type: string
      enum: [maintain, write, triage, read]
    RepositoryMember:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        created_at: { type: string, format: date-time }
    BranchRule:
      type: object
      properties:
        branch: { type: string }
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        block_changes_requested: { type: boolean }
        updated_at: { type: string, format: date-time }
    DeletedRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        deleted_at: { type: string, format: date-time }
        purge_after: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: ["repo:read", "repo:write"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BrowserSession:
      type: object
      properties:
        id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PublicRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    Profile:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        location: { type: string }
        created_at: { type: string, format: date-time }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
        followed: { type: boolean }
        showcase:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
        repositories:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
    IssueTemplate:
      type: object
      required: [name, title, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        author: { type: string }
        created_at: { type: string, format: date-time }
    IssueComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
    PublicUser:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
    IssueAssignees:
      type: object
      properties:
        assigned:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
        available:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
    IssueSubscription:
      type: object
      properties:
        subscribed: { type: boolean }
    FeedEvent:
      type: object
      properties:
        kind:
          {
            type: string,
            enum:
              [
                repository_created,
                repository_sparked,
                issue_opened,
                unite_opened,
              ],
          }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind:
          { type: string, enum: [issue_comment, issue_closed, issue_reopened] }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        issue: { type: integer }
        title: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    Milestone:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        state: { type: string, enum: [open, closed] }
        due_date: { type: [string, "null"], format: date }
        open_issues: { type: integer }
        closed_issues: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardItem:
      type: object
      properties:
        issue_id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
        status: { type: string, enum: [todo, progress, done] }
        author: { type: string }
    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^[0-9a-f]{6}$" }
        description: { type: string }
        created_at: { type: string, format: date-time }
    Pull:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed, merging, merged] }
        author: { type: string }
        created_at: { type: string, format: date-time }
        base_branch: { type: string }
        head_branch: { type: string }
        merge_sha: { type: [string, "null"] }
    PullComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
