                  tokens_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /user/activity:
    get:
      summary: Read the latest 30 activity records for your account
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    action: { type: string }
                    target: { type: string }
                    created_at: { type: string, format: date-time }
  /user/deleted-repositories:
