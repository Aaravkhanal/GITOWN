openapi: 3.1.0
info:
  title: GITOWN API
  # Keep in sync with the root package.json version, which builds inject
  # into the API (/healthz) and CLI (gitown version).
  version: 0.1.0
  description: |
    Email is written to a durable outbox and sent by a background worker when
    GITOWN_SMTP_ADDR and GITOWN_SMTP_FROM are configured; otherwise messages
    are recorded as suppressed. POST /email/unsubscribe also accepts RFC 8058
    one-click requests from mail clients (token in the query, form body, no
    Origin header).
    Local development alpha. Browser API authentication uses an HttpOnly session
    cookie. Every mutation requires an Origin header equal to GITOWN_ORIGIN;
    mutations other than DELETE require application/json. Git personal access
    tokens with repo:read or repo:write authenticate Git transport. Tokens with
    package:read or package:write authenticate crate routes with
    Authorization: Bearer. A package token cannot push Git. Session cookies
    still authenticate the JSON API. The SSH gateway is a forced command, not
    an embedded server, and it trusts the fingerprint argument. A Drop reports
    two independent signature claims: tag_signed is a real `git tag -v`
    verification of the Git tag object against the account's registered
    signing keys, and provenance_verified is a separate verification of a
    publisher-supplied signed note about the release artifacts. Neither
    implies the other. Crate publishing, unscoped npm routes at /npm, and OCI
    blob and manifest routes at /v2 use a fixed pattern list, not a malware
    engine (npm publishes are scanned after decompressing the tarball, not
    against its raw bytes). Those routes are not a full npm registry or a
    container registry. OCI image namespaces are crate records under
    ecosystem=oci: a namespace is created private on first push, owned by
    whoever pushed it, and only its owner can push to it or read it until it
    is made public via PATCH /crates/{name}?ecosystem=oci. Drop asset download
    counts increment at most once per identity (session user, else caller IP)
    per hour. Code search ranks a capped index of public default-branch
    text and falls back to git grep. District invoices record operator-entered
    amounts and do not charge a card. Most lists return bounded arrays; public
    repository and builder search use offset pagination with 25-item pages.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /repos/{owner}/{repo}/wiki:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: List Git-backed wiki page slugs on the default branch
      responses:
        "200":
          description: Visible page slugs and the current branch head SHA
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages: { type: array, items: { type: string } }
                  head_sha: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/wiki/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - {
          name: slug,
          in: path,
          required: true,
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,79}$" },
        }
    get:
      security: []
      summary: Read a UTF-8 wiki page from the default branch
      responses:
        "200":
          description: Markdown source and current branch head SHA
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  content: { type: string }
                  head_sha: { type: string }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Create or edit a wiki page as a Git commit, with stale-head and branch-rule protection
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expected_head]
              properties:
                content: { type: string, maxLength: 131072 }
                expected_head: { type: string, pattern: "^[0-9a-f]{40}$" }
      responses:
        "201":
          description: Saved wiki commit
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  sha: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /search/builders:
    get:
      security: []
      summary: Search public builder profiles by name, bio, skills, location, or availability
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: skill,
            in: query,
            description: Exact skill tag match (case-insensitive),
            schema: { type: string, maxLength: 60 },
          }
        - {
            name: location,
            in: query,
            description: Location substring match,
            schema: { type: string, maxLength: 100 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 1000 },
          }
        - { name: available, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Up to 25 matching builders and a next-page flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderSearch" }
        "422": { $ref: "#/components/responses/Error" }
  /search/work:
    get:
      security: []
      summary: Search public issues and Unite requests
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 1000 },
          }
      responses:
        "200":
          description: Up to 25 matching work items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkSearch" }
        "422": { $ref: "#/components/responses/Error" }
  /search/code:
    get:
      security: []
      summary: Ranked search of capped public text, with a git-grep fallback
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 2, maxLength: 80 },
          }
      responses:
        "200": { description: Up to 40 matching lines }
        "422": { $ref: "#/components/responses/Error" }
  /search/tasks:
    get:
      security: []
      summary: Public open issues labeled help wanted or good first task
      parameters:
        - {
            name: kind,
            in: query,
            schema: { type: string, enum: ["help", "first"] },
          }
      responses:
        "200": { description: Matching tasks }
  /search/recommendations:
    get:
      summary: Topic-overlap recommendations, or trending when signed out
      responses:
        "200": { description: Up to 12 repositories }
  /districts:
    get:
      summary: List visible districts
      responses:
        "200": { description: Districts }
    post:
      summary: Create a district
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "201": { description: Created district }
  /districts/{slug}:
    get:
      security: []
      summary: A district's own page. Public for a public district; requires membership for a private one.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: District }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update district settings. Owner only.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Updated district }
        "403": { $ref: "#/components/responses/Error" }
  /districts/{slug}/members:
    get:
      summary: List district members. Requires membership.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Members }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Add or re-role a member. Granting admin requires the owner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Membership saved }
        "403": { $ref: "#/components/responses/Error" }
  /districts/{slug}/members/{username}:
    delete:
      summary: Remove a district member. Removing an admin requires the owner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/crews:
    get:
      summary: List a district's crews. Requires membership.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Crews }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a crew. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "201": { description: Crew created }
        "403": { $ref: "#/components/responses/Error" }
  /districts/{slug}/crews/{crew}:
    delete:
      summary: Delete a crew. Requires district admin. Refused while a branch rule requires this crew.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: crew, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A branch protection rule still requires this crew
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /districts/{slug}/crews/{crew}/members:
    get:
      summary: List a crew's members. Requires membership.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: crew, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Crew members }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a district member to a crew. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: crew, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Added }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/crews/{crew}/members/{username}:
    delete:
      summary: Remove a crew member. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: crew, in: path, required: true, schema: { type: string } }
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/secrets:
    get:
      summary: List a district's secret names (never values). Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Secret names }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Store or replace a secret, encrypted at rest. Requires district admin and GITOWN_SECRET_KEY.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "201": { description: Stored }
        "403": { $ref: "#/components/responses/Error" }
        "503":
          description: GITOWN_SECRET_KEY is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /districts/{slug}/secrets/{name}:
    get:
      summary: Read one secret's value. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Secret value }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a secret. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/webhooks:
    get:
      summary: List a district's webhooks. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Webhooks (never includes the secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: >
        Create a district-wide webhook. Requires district admin. Fires for
        matching events across every repository owned by the district.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                kind:
                  type: string
                  enum: ["generic", "slack", "discord"]
                  description: >-
                    Reshapes the delivery body into what Slack or Discord
                    expects; defaults to generic.
      responses:
        "201":
          description: Webhook created; secret is shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /districts/{slug}/webhooks/{id}:
    patch:
      summary: >
        Update a district webhook's URL, events, active flag, or regenerate
        its secret. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                active: { type: boolean }
                regenerate_secret: { type: boolean }
      responses:
        "200":
          description: Updated webhook; secret is present only when regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a district webhook. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Webhook removed }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/webhooks/{id}/deliveries:
    get:
      summary: >
        List a district webhook's delivery attempts, most recent first.
        Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/webhooks/{id}/deliveries/{deliveryId}/replay:
    post:
      summary: >
        Re-send a past district webhook delivery's exact event and payload.
        Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "201": { description: A new delivery was queued }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/audit:
    get:
      summary: District audit log. Requires district admin.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - {
            name: download,
            in: query,
            schema: { type: string, enum: ["1"] },
            description: Returns a CSV attachment instead of JSON,
          }
      responses:
        "200": { description: Audit events, or a CSV file when download=1 }
        "403": { $ref: "#/components/responses/Error" }
  /districts/{slug}/repos:
    get:
      security: []
      summary: A district's repositories, filtered to what the caller can see
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Repositories }
        "404": { $ref: "#/components/responses/Error" }
  /crates:
    get:
      summary: List crate records for one ecosystem (default npm; pass ?ecosystem=oci for image namespaces)
      parameters:
        - {
            name: ecosystem,
            in: query,
            schema: { type: string, enum: [npm, oci] },
          }
      responses:
        "200": { description: Crate records }
    post:
      summary: Create a crate record (npm or oci); a pushed OCI namespace also auto-creates one, private, owned by the pusher
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "201": { description: Created crate }
  /crates/{name}:
    get:
      summary: A crate's description, visibility, retention, and published versions
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - {
            name: ecosystem,
            in: query,
            schema: { type: string, enum: [npm, oci] },
          }
      responses:
        "200": { description: Crate detail with versions }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update description, visibility, or retention. Owner only; this is how an OCI namespace is made public.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - {
            name: ecosystem,
            in: query,
            schema: { type: string, enum: [npm, oci] },
          }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Updated crate }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a crate and all its versions. Owner only.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - {
            name: ecosystem,
            in: query,
            schema: { type: string, enum: [npm, oci] },
          }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
  /user/ssh-keys:
    get:
      summary: List SSH public keys
      responses:
        "200": { description: Keys and fingerprints }
    post:
      summary: Register an SSH public key and return an authorized_keys line
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "201": { description: Key created }
  /topics:
    get:
      security: []
      summary: Public topic catalog
      responses:
        "200": { description: Up to 50 topics with repository counts }
  /topics/{topic}:
    get:
      security: []
      summary: Public repositories that carry one topic
      parameters:
        - { name: topic, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Up to 30 public repositories }
        "404": { $ref: "#/components/responses/Error" }
  /users/{username}/contributions:
    get:
      security: []
      summary: Public activity counts for the last 180 UTC days
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Daily counts of public issues,
            comments,
            Sparks,
            and merged Unite requests,
          }
        "404": { $ref: "#/components/responses/Error" }
  /collections/{owner}/{slug}:
    patch:
      summary: Feature a collection. Requires the caller username in GITOWN_OPERATORS.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Featured flag saved }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/usage:
    get:
      summary: District usage counts for an owner or admin. charges is false.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Repository,
            storage,
            member,
            secret,
            and open-invoice counts,
          }
  /districts/{slug}/invoices:
    get:
      summary: Invoice ledger for a district owner or admin. Does not charge a card.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invoices and charges false }
    post:
      summary: Record an invoice. Requires GITOWN_OPERATORS. Does not charge a card.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "201": { description: Open invoice recorded }
        "403": { $ref: "#/components/responses/Error" }
  /districts/{slug}/invoices/{id}/pay:
    post:
      summary: Mark an open invoice paid. Requires GITOWN_OPERATORS. Does not charge a card.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Invoice marked paid }
        "403": { $ref: "#/components/responses/Error" }
  /user/signing-keys:
    get:
      summary: List SSH signing keys registered by the signed-in account
      responses:
        "200": { description: Signing key titles and fingerprints }
    post:
      summary: Register an SSH public key for drop provenance verification
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "201": { description: Signing key created }
        "409": { $ref: "#/components/responses/Error" }
  /user/signing-keys/{id}:
    delete:
      summary: Remove one SSH signing key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200": { description: Signing key removed }
  /user/invitations:
    get:
      summary: List invitations addressed to the signed-in account
      responses:
        "200": { description: Invitations }
  /user/invitations/{id}/accept:
    post:
      summary: Accept an invitation addressed to the signed-in username
      description: Invitations sent to a bare email address are accepted with /invitations/accept and the emailed token instead.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Accepted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /user/invitations/{id}/decline:
    post:
      summary: Decline an invitation addressed to the signed-in username
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Declined }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      summary: Accept an email invitation with the token from its link
      description: Binds the invitation to the signed-in account. Invitations addressed to a username can only be accepted by that account.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Accepted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /user/transfers:
    get:
      summary: List ownership transfers offered to the signed-in account
      responses:
        "200": { description: Transfers }
  /user/transfers/{id}/accept:
    post:
      summary: Accept ownership of a repository
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Ownership moved }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Transfer closed, stale because the owner changed, or the name is already taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /user/transfers/{id}/decline:
    post:
      summary: Decline a repository ownership transfer
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Declined }
        "404": { $ref: "#/components/responses/Error" }
  /user/email-notifications:
    get:
      summary: Read email delivery preference
      responses:
        "200": { description: immediate, digest, or off }
    put:
      summary: Set email delivery to immediate, digest, or off
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Saved preference }
  /email/unsubscribe:
    get:
      security: []
      summary: Preview which address an unsubscribe link controls (no changes)
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Masked address and current email preference }
        "404": { $ref: "#/components/responses/Error" }
    post:
      security: []
      summary: Turn email off with an unsubscribe token (web or RFC 8058 one-click)
      parameters:
        - {
            name: token,
            in: query,
            description: Required for one-click requests from mail clients,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe: { type: string, enum: [One-Click] }
      responses:
        "200": { description: Email turned off }
        "404": { $ref: "#/components/responses/Error" }
  /user/notifications/unread-count:
    get:
      summary: Count unread visible notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Error" }
  /users/{username}/followers:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
      - {
          name: offset,
          in: query,
          schema: { type: integer, minimum: 0, maximum: 10000 },
        }
    get:
      security: []
      summary: List people who follow a builder, 30 per page
      responses:
        "200":
          description: Followers, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowList" }
        "404": { $ref: "#/components/responses/Error" }
  /users/{username}/following:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
      - {
          name: offset,
          in: query,
          schema: { type: integer, minimum: 0, maximum: 10000 },
        }
    get:
      security: []
      summary: List people a builder follows, 30 per page
      responses:
        "200":
          description: Followed builders, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowList" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/subscription:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      summary: Read how a repository notifies you (owners and maintainers watch by default)
      responses:
        "200":
          description: Repository notification mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryWatch" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Watch, participate in, or ignore a repository
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  { type: string, enum: [watching, participating, ignoring] }
      responses:
        "200":
          description: Saved mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryWatch" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/showcase:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      security: []
      summary: Generated project showcase built from README, presentation, people, Drops, milestones, and open tasks
      responses:
        "200":
          description: Showcase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Showcase" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/presentation:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    put:
      summary: Set the demo link, tech stack, and optional screenshots
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                homepage: { type: string, maxLength: 300 }
                stack: { type: string, maxLength: 200 }
                screenshots:
                  type: array
                  maxItems: 6
                  description: Replaces all screenshots when present
                  items: { $ref: "#/components/schemas/Screenshot" }
      responses:
        "200": { description: Saved presentation }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/threads:
    get:
      summary: List inline review conversations
      responses:
        "200": { description: Threads, including outdated and resolved state }
    post:
      summary: Comment on an exact file, side, and line of the current head
      description: The line must appear in the unite request's diff on that side (changed or context lines).
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit_sha, path, side, line, body]
              properties:
                commit_sha: { type: string }
                path: { type: string }
                side: { type: string, enum: [left, right] }
                line: { type: integer, minimum: 1 }
                body: { type: string, maxLength: 10000 }
      responses:
        "201": { description: Conversation created }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/threads/{id}/resolve:
    post:
      summary: Resolve or reopen a conversation (its author or a triager)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolved: { type: boolean }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/threads/{id}/replies:
    get:
      summary: List replies in a conversation
      responses:
        "200":
          description: Replies, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    author: { type: string }
                    body: { type: string }
                    created_at: { type: string, format: date-time }
    post:
      summary: Reply in a conversation
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "201": { description: Reply created }
  /repos/{owner}/{repo}/pulls/{number}/reviews/{id}/dismiss:
    post:
      summary: Dismiss a review with a reason (the reviewer or a maintainer)
      description: The reason is kept in the timeline and the audit log. Dismissed reviews no longer count toward branch rules.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Dismissed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/timeline:
    get:
      summary: Unite request history
      description: Comments, reviews, inline comments and replies, pushes, check results, and state changes, oldest first, 50 per page.
      parameters:
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 1000 },
          }
      responses:
        "200":
          description: Timeline page
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        actor: { type: string }
                        body: { type: string }
                        created_at: { type: string, format: date-time }
  /repos/{owner}/{repo}/pulls/{number}/crews:
    get:
      summary: List crews that can review and crews already requested
      responses:
        "200": { description: District crews and requested crew slugs }
    put:
      summary: Request reviews from district crews (triage)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slugs: { type: array, maxItems: 5, items: { type: string } }
      responses:
        "200": { description: Requested crews }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/commits/{sha}/statuses:
    get:
      security: []
      summary: List check results for a commit
      responses:
        "200":
          {
            description: "Statuses with state, description, target_url, and reporter",
          }
  /repos/{owner}/{repo}/commits/{sha}/status:
    post:
      security: [{ session: [] }, { token: [] }]
      summary: Report a check result for a commit
      description: CI systems authenticate with a personal access token with repo:write scope as a bearer token; no Origin header is needed then. Browser sessions must send the Origin header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, state]
              properties:
                context:
                  {
                    type: string,
                    pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,39}$",
                  }
                state:
                  { type: string, enum: [pending, success, failure, error] }
                description: { type: string, maxLength: 300 }
                target_url: { type: string, format: uri, maxLength: 500 }
      responses:
        "200": { description: Saved status }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/planning:
    put:
      summary: Set pin, priority, estimate, due date, iteration, or duplicate
      description: >
        Marking an issue as a duplicate closes it with state_reason duplicate
        and rejects cycles. Clearing the mark reopens an issue that was closed
        only because it was a duplicate. Requires triage permission.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: boolean }
                priority:
                  { type: string, enum: [none, low, medium, high, urgent] }
                estimate: { type: integer, minimum: 0, maximum: 100 }
                clear_estimate: { type: boolean }
                due_date:
                  { type: string, description: "YYYY-MM-DD, or empty to clear" }
                iteration: { type: string, maxLength: 40 }
                duplicate_of: { type: integer, minimum: 1 }
                clear_duplicate: { type: boolean }
      responses:
        "200": { description: Planning saved }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/sub-issues:
    get:
      security: []
      summary: Show an issue's parent and its sub-issues with progress
      responses:
        "200":
          description: Parent and children
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubIssues" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/parent:
    put:
      summary: Nest an issue under a parent in the same repository, or detach it
      description: Cycles and nesting deeper than eight levels are rejected. Requires triage permission.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent: { type: [integer, "null"], minimum: 1 }
      responses:
        "200":
          description: Updated hierarchy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubIssues" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/references:
    get:
      security: []
      summary: List the issues this issue mentions and what mentions it
      description: >
        References are recorded from issue, unite request, and comment bodies
        that contain #N or owner/repository#N. Items in repositories the viewer
        cannot read are omitted.
      responses:
        "200":
          description: Mentions and back-references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueReferences" }
  /repos/{owner}/{repo}/issues/{number}/transfer:
    post:
      summary: Move an issue to another repository where you can triage
      description: >
        Requires write permission on the source. Labels, milestone, board
        state, links, and dependencies stay behind; assignees without access to
        the destination are removed. The old number reports issue_transferred.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository:
                  {
                    type: string,
                    description: "owner/name, or a name owned by the same account",
                  }
      responses:
        "200":
          description: New location
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner: { type: string }
                  repository: { type: string }
                  number: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/comments/{id}:
    patch:
      summary: Edit your own issue comment; the previous body is kept as history
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Comment updated }
        "403": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/comments/{id}/history:
    get:
      security: []
      summary: List earlier versions of an edited issue comment
      responses:
        "200": { description: Revisions, oldest first }
        "404": { $ref: "#/components/responses/Error" }
  /user/saved-searches:
    get:
      summary: List your saved searches
      responses:
        "200":
          description: Up to 20 saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedSearch" }
    post:
      summary: Save a search query
      description: The web app stores issue filters as repo=owner/name followed by the issue list query string.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query]
              properties:
                name: { type: string, maxLength: 80 }
                query: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Saved search
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /user/saved-searches/{id}:
    delete:
      summary: Delete one of your saved searches
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /search/repositories:
    get:
      security: []
      summary: Search public repositories with pagination
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: topic, in: query, schema: { type: string } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [recent, name, sparks, trending] },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 1000 },
          }
      responses:
        "200":
          description: Up to 25 matching repositories and a next-page flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositorySearch" }
        "422": { $ref: "#/components/responses/Error" }
  /users/{username}/profile:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    get:
      security: []
      summary: Read a public profile, showcase, and up to 100 public repositories
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/Error" }
  /users/{username}/follow:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    put:
      summary: Follow or unfollow another builder
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [followed]
              properties:
                followed: { type: boolean }
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /user/profile:
    put:
      summary: Update your public profile
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, bio, website, location]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
                bio: { type: string, maxLength: 500 }
                website:
                  {
                    type: string,
                    maxLength: 300,
                    description: Optional HTTPS URL,
                  }
                location: { type: string, maxLength: 100 }
                skills:
                  {
                    type: string,
                    maxLength: 200,
                    description: Comma-separated skills,
                  }
                availability: { type: string, maxLength: 200 }
                open_to_collaborators: { type: boolean }
                links:
                  type: array
                  maxItems: 5
                  description: Replaces all links when present
                  items: { $ref: "#/components/schemas/ProfileLink" }
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /user/showcase:
    put:
      summary: Set up to six distinct public repositories you own as your showcase
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository_ids]
              properties:
                repository_ids:
                  type: array
                  maxItems: 6
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /user/feed:
    get:
      summary: List up to 100 recent public activities by followed builders
      responses:
        "200":
          description: Following feed, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedEvent" }
        "401": { $ref: "#/components/responses/Error" }
  /user/notifications:
    get:
      summary: List visible notifications newest first, paged with a cursor
      parameters:
        - {
            name: before,
            in: query,
            description: Return notifications older than this id,
            schema: { type: integer, format: int64 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: filter,
            in: query,
            schema: { type: string, enum: [all, unread] },
          }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200":
          description: In-app inbox
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Error" }
  /user/notifications/{id}/read:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: integer, format: int64 },
        }
    put:
      summary: Mark one of your notifications read
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      security: []
      summary: Read current session and signup availability
      responses:
        "200":
          description: User is null for anonymous sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/User"
                      - type: "null"
                  signup_enabled: { type: boolean }
  /auth/register:
    post:
      security: []
      summary: Register and start a session if signup is enabled
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, maxLength: 39 }
                display_name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      security: []
      summary: Sign in using username or email and password
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke this browser session and clear the cookie
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
  /user/tokens:
    get:
      summary: List your token metadata, never secret values
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Token" } }
    post:
      summary: Generate a token; its secret is returned once
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scope: { type: string, enum: ["repo:read", "repo:write"] }
      responses:
        "201":
          description: One-time token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  details: { $ref: "#/components/schemas/Token" }
        "422": { $ref: "#/components/responses/Error" }
  /user/tokens/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      summary: Revoke an owned token immediately
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /user/sessions:
    get:
      summary: List up to 20 active browser sessions and identify the current one
      responses:
        "200":
          description: Active browser sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BrowserSession" }
  /user/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke one owned browser session
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /user/password:
    patch:
      summary: Change your password and revoke every other browser session
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, revoke_access_tokens]
              properties:
                current_password: { type: string, maxLength: 128 }
                new_password: { type: string, minLength: 12, maxLength: 128 }
                revoke_access_tokens: { type: boolean }
      responses:
        "200":
          description: Password changed, with revocation counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sessions_revoked: { type: integer }
                  tokens_revoked: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /user/activity:
    get:
      summary: Read the latest 30 activity records for your account
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    action: { type: string }
                    target: { type: string }
                    created_at: { type: string, format: date-time }
  /user/deleted-repositories:
    get:
      summary: List owned repositories in the 30-day recovery window
      responses:
        "200":
          description: Deleted repositories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeletedRepository" }
  /user/deleted-repositories/{id}/restore:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Restore an owned soft-deleted repository
      responses:
        "200": { description: Repository restored }
        "404": { $ref: "#/components/responses/Error" }
  /repos:
    get:
      security: []
      summary: List up to 100 visible repositories, newest first
      parameters:
        - { name: mine, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Visible repositories
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/Repository" },
                }
    post:
      summary: Create an owned repository and optional README commit
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, visibility]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                visibility: { type: string, enum: [public, private] }
                readme: { type: boolean, default: false }
      responses:
        "201":
          description: Repository created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read a visible repository and its branches
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository: { $ref: "#/components/schemas/Repository" }
                  branches: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update an owned repository's description and visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, visibility]
              properties:
                description: { type: string, maxLength: 500 }
                visibility: { type: string, enum: [public, private] }
      responses:
        "200":
          description: Repository updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Schedule an owned repository for deletion with 30-day recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string }
      responses:
        "200": { description: Repository scheduled for deletion }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/spark:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read a visible repository's Spark count and viewer state
      responses:
        "200":
          description: Spark state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SparkState" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Spark or un-Spark a visible repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sparked]
              properties:
                sparked: { type: boolean }
      responses:
        "200":
          description: Updated Spark state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SparkState" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/topics:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read topics on a visible repository
      responses:
        "200":
          description: Alphabetically sorted topics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicState" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Set up to ten topics on an owned, active repository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicState" }
      responses:
        "200":
          description: Updated topics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicState" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/rename:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    post:
      summary: Rename an owned repository without moving opaque Git storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Renamed repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/archive:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    post:
      summary: Archive an owned repository as read-only
      responses:
        "200":
          description: Archived repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
  /repos/{owner}/{repo}/unarchive:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    post:
      summary: Restore writes to an archived owned repository
      responses:
        "200":
          description: Unarchived repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
  /repos/{owner}/{repo}/members:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List collaborators as the repository owner
      responses:
        "200":
          description: Repository collaborators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepositoryMember" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/members/{username}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: username, in: path, required: true, schema: { type: string } },
      ]
    patch:
      summary: Change a collaborator role as the repository owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/RepositoryRole" }
      responses:
        "200":
          description: Collaborator updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryMember" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a collaborator as the repository owner
      responses:
        "200": { description: Collaborator removed }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/deploy-keys:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List a repository's deploy keys as a manager
      responses:
        "200":
          description: Deploy keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeployKey" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Register a deploy key, scoped to only this repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, public_key]
              properties:
                title: { type: string }
                public_key: { type: string }
                write:
                  type: boolean
                  description: Allow this key to push, not only clone or fetch.
      responses:
        "201":
          description: Deploy key registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployKey" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/deploy-keys/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: id, in: path, required: true, schema: { type: string } },
      ]
    delete:
      summary: Remove a deploy key
      responses:
        "200": { description: Deploy key removed }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/webhooks:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List a repository's webhooks as a manager
      responses:
        "200":
          description: Webhooks (never includes the secret)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a webhook subscription for this repository
      description: >
        The URL must be https:// and must not resolve to a private, loopback,
        or link-local address; this is re-checked on every delivery attempt,
        not only at creation, so a target that later repoints at an internal
        address is refused rather than followed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                kind:
                  type: string
                  enum: ["generic", "slack", "discord"]
                  description: >-
                    Reshapes the delivery body into what Slack or Discord
                    expects; defaults to generic.
      responses:
        "201":
          description: Webhook created; secret is shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/webhooks/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: id, in: path, required: true, schema: { type: string } },
      ]
    patch:
      summary: Update a webhook's URL, events, active flag, or regenerate its secret
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                active: { type: boolean }
                regenerate_secret: { type: boolean }
      responses:
        "200":
          description: Updated webhook; secret is present only when regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a webhook
      responses:
        "200": { description: Webhook removed }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/webhooks/{id}/deliveries:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: id, in: path, required: true, schema: { type: string } },
        { name: page, in: query, schema: { type: integer, minimum: 1 } },
        {
          name: per_page,
          in: query,
          schema: { type: integer, minimum: 1, maximum: 100 },
        },
      ]
    get:
      summary: List a webhook's delivery attempts, most recent first
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/webhooks/{id}/deliveries/{deliveryId}/replay:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: id, in: path, required: true, schema: { type: string } },
        {
          name: deliveryId,
          in: path,
          required: true,
          schema: { type: string },
        },
      ]
    post:
      summary: Re-send a past delivery's exact event and payload
      responses:
        "201": { description: A new delivery was queued }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/refs:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        {
          name: offset,
          in: query,
          schema: { type: integer, minimum: 0, maximum: 5000 },
        },
      ]
    get:
      summary: List ref-change events (branch and tag creates, updates, and deletes)
      description: >
        Every ref update GITOWN accepts is recorded here with its old and new
        SHA, the actor, and how the push arrived (https, ssh, or api),
        regardless of which of those paths made the change.
      responses:
        "200":
          description: Ref events, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RefEvent" }
                  has_more: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/maintenance:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    put:
      summary: Repack a repository's Git storage now
      description: >
        GITOWN also runs this automatically for any repository that hasn't
        been maintained in 14 days, a few at a time, on the same background
        worker loop that delivers email.
      responses:
        "200":
          description: Maintenance finished
          content:
            application/json:
              schema:
                type: object
                properties:
                  size_bytes: { type: integer }
                  language: { type: string }
                  last_maintained_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/tags:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List a repository's tags
      description: >
        `signed` reflects `git tag -v` verifying the tag against a signing
        key someone has registered with GITOWN, the same trust store used
        for commit signature verification on protected branches — not a
        search for a signature-shaped block of text.
      responses:
        "200":
          description: Tags, most recently created first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        sha: { type: string }
                        subject: { type: string }
                        signed: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/permissions:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: The signed-in viewer's capabilities in this repository
      description: read views and comments; triage manages issues and review requests; write pushes and merges; maintain edits branch rules, dismisses reviews, and pushes to restricted branches; manage (owner or district admin) controls access, visibility, transfer, and deletion.
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  read: { type: boolean }
                  triage: { type: boolean }
                  write: { type: boolean }
                  maintain: { type: boolean }
                  manage: { type: boolean }
  /repos/{owner}/{repo}/invitations:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List invitations for the repository (manage)
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
    post:
      summary: Invite a username or an email address (manage)
      description: Collaborators are added only when the invitee accepts. An email address that belongs to an account becomes an invitation to that account. Invitations to other addresses return accept_url and are emailed when mail is configured.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/RepositoryRole" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Already a collaborator, or an invitation is already pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/invitations/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      summary: Revoke a pending invitation (manage)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/transfer:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: Show the pending ownership transfer (manage)
      responses:
        "200":
          { description: "{ pending: { id, username, created_at } | null }" }
    post:
      summary: Offer ownership to another account (manage)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, confirm]
              properties:
                username: { type: string }
                confirm:
                  {
                    type: string,
                    description: The repository's owner/name,
                    typed to confirm,
                  }
      responses:
        "201": { description: Transfer pending the recipient's acceptance }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the pending ownership transfer (manage)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/tree:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Browse a branch's tree or text file
      parameters:
        - {
            name: ref,
            in: query,
            description: Branch name; defaults to the repository default,
            schema: { type: string },
          }
        - { name: path, in: query, schema: { type: string, default: "" } }
      responses:
        "200":
          description: Tree, text content, or binary marker
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch: { type: string }
                  path: { type: string }
                  sha: { type: string }
                  content: { type: string }
                  binary: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string, enum: [tree, blob, commit] }
                        sha: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/contents:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    put:
      summary: Create or replace a text file with an atomic Git commit
      description: Requires repository write access. The expected branch head prevents a browser edit from overwriting a concurrent push.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch, path, content, message, expected_head]
              properties:
                branch: { type: string }
                path: { type: string, maxLength: 4096 }
                content: { type: string, maxLength: 524288 }
                message: { type: string, maxLength: 200 }
                expected_head: { type: string, minLength: 40, maxLength: 40 }
      responses:
        "201":
          description: File commit created and branch advanced
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha: { type: string }
                  branch: { type: string }
                  path: { type: string }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a file with an atomic Git commit
      description: Requires repository write access. The expected branch head prevents deletion after a concurrent push.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch, path, message, expected_head]
              properties:
                branch: { type: string }
                path: { type: string, maxLength: 4096 }
                message: { type: string, maxLength: 200 }
                expected_head: { type: string, minLength: 40, maxLength: 40 }
      responses:
        "200": { description: File deletion committed and branch advanced }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/raw:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read or download an exact file from a visible repository
      parameters:
        - { name: ref, in: query, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Raw file bytes, limited to 4 MiB
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/commits:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read the latest 30 commits on a branch
      parameters:
        - { name: ref, in: query, schema: { type: string } }
        - {
            name: path,
            in: query,
            description: Optional file path whose history should be followed,
            schema: { type: string },
          }
      responses:
        "200":
          description: Commit history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sha: { type: string }
                    message: { type: string }
                    author: { type: string }
                    date: { type: string, format: date-time }
  /repos/{owner}/{repo}/branch-rules:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { name: branch, in: query, required: true, schema: { type: string } }
    get:
      security: []
      summary: Read the merge guard for an existing visible branch
      responses:
        "200":
          description: Stored rule or the permissive default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchRule" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    put:
      summary: Create or replace a branch rule (owner, maintainer, or district admin)
      description: Rules apply equally to browser edits, API merges, HTTPS pushes, and SSH pushes.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required_approvals]
              properties:
                required_approvals: { type: integer, minimum: 0, maximum: 10 }
                block_changes_requested: { type: boolean }
                require_unite: { type: boolean, default: false }
                require_resolved: { type: boolean, default: false }
                require_up_to_date: { type: boolean, default: false }
                restrict_push: { type: boolean, default: false }
                require_signed: { type: boolean, default: false }
                require_maintainer_approval: { type: boolean, default: false }
                required_checks:
                  { type: array, maxItems: 8, items: { type: string } }
                required_reviewers:
                  type: array
                  maxItems: 8
                  items:
                    {
                      type: string,
                      description: "A username, or crew:<slug> for a crew in the repository's district",
                    }
                allow_force_push: { type: boolean, default: false }
                allow_deletion: { type: boolean, default: false }
      responses:
        "200":
          description: Saved merge guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchRule" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issue-templates:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: Read ordered issue templates on a visible repository
      parameters:
        - name: include_defaults
          in: query
          description: Also return the built-in Bug report and Feature request forms for kinds the repository has not defined.
          schema: { type: boolean }
      responses:
        "200":
          description: Up to ten issue templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueTemplate" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace the owned repository's issue templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templates]
              properties:
                templates:
                  type: array
                  maxItems: 10
                  items: { $ref: "#/components/schemas/IssueTemplate" }
      responses:
        "200":
          description: Updated templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueTemplate" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List and filter issues with pagination
      parameters:
        - {
            name: state,
            in: query,
            schema: { type: string, enum: [open, closed, all] },
          }
        - name: label
          in: query
          description: Repeat up to five times; issues must carry every label.
          schema: { type: array, items: { type: string }, maxItems: 5 }
          style: form
          explode: true
        - {
            name: assignee,
            in: query,
            schema: { type: string },
            description: A username,
            or none,
          }
        - { name: author, in: query, schema: { type: string } }
        - {
            name: milestone,
            in: query,
            schema: { type: string },
            description: A milestone title,
            or none,
          }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [newest, oldest, updated] },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        "200":
          description: One page of issues; pinned issues first
          headers:
            X-Total-Count:
              {
                schema: { type: integer },
                description: Issues matching every filter,
              }
            X-Open-Count:
              {
                schema: { type: integer },
                description: Open issues matching the non-state filters,
              }
            X-Closed-Count:
              {
                schema: { type: integer },
                description: Closed issues matching the non-state filters,
              }
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Issue" } }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Open an issue as any signed-in user who can read the repository
      description: >
        Setting parent requires triage permission. When template names a form
        template, fields are validated and rendered into the body as Markdown
        sections, and body becomes the Additional context section.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                template: { type: string }
                fields:
                  type: object
                  additionalProperties: { type: string }
                parent: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read one issue
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404":
          description: Not found, or issue_transferred with the new location in the message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Edit, close, or reopen an issue
      description: Triage users can change any issue; authors can change their own. Closing as completed requires closed blockers.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [open, closed] }
                state_reason: { type: string, enum: [completed, not_planned] }
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Updated issue fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [open, closed] }
                  title: { type: string }
                  body: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/dependencies:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read what blocks this issue and what this issue blocks
      responses:
        "200":
          description: Issue dependency links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueDependencies" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace up to 20 blockers; rejects cycles and cross-repository links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_by]
              properties:
                blocked_by:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated dependency links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueDependencies" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/assignees:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: List assigned and eligible repository members
      responses:
        "200":
          description: Issue assignment choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueAssignees" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace issue assignees with up to 10 repository members
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200":
          description: Updated assignment choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueAssignees" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/subscription:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: Read whether the current user follows an issue
      responses:
        "200":
          description: Subscription state; false for anonymous readers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Follow or unfollow an issue
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscribed]
              properties:
                subscribed: { type: boolean }
      responses:
        "200":
          description: Saved subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueSubscription" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/milestones:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: List up to 100 milestones with open and closed issue counts
      responses:
        "200":
          description: Milestones, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
    post:
      summary: Create a milestone with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                due_date: { type: string, format: date }
      responses:
        "201":
          description: Created milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/milestones/{id}:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Replace milestone details or close and reopen it
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, state]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                state: { type: string, enum: [open, closed] }
                due_date:
                  {
                    type: string,
                    format: date,
                    description: Empty string clears the due date,
                  }
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/milestone:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    get:
      security: []
      summary: Read the milestone assigned to an issue
      responses:
        "200":
          description: Assigned milestone or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestone:
                    oneOf:
                      - { $ref: "#/components/schemas/Milestone" }
                      - { type: "null" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Assign or clear an issue milestone with repository triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestone_id]
              properties:
                milestone_id: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: Updated issue milestone }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/board:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: List issues and added unite requests on the planning board
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        "200":
          description: Board items; pinned issues first
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardItem" }
  /repos/{owner}/{repo}/board/settings:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    get:
      security: []
      summary: Read board columns, automation, and custom fields
      responses:
        "200":
          description: Board settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardSettings" }
    put:
      summary: Replace the board columns and automation setting
      description: >
        Use 2 to 10 columns with distinct keys; the last column must have key
        done. Items in removed columns move to the first column. Requires write
        permission.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns, automation]
              properties:
                columns:
                  type: array
                  minItems: 2
                  maxItems: 10
                  items: { $ref: "#/components/schemas/BoardColumn" }
                automation: { type: boolean }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/board/fields:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    post:
      summary: Add a custom board field (up to 20)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, maxLength: 40 }
                kind:
                  { type: string, enum: [text, number, date, single_select] }
                options: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardField" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/board/fields/{id}:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename a field or change its options; values for removed options are cleared
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200":
          description: Updated field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardField" }
    delete:
      summary: Delete a custom field and its values
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/board/values:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
    put:
      summary: Set or clear a custom field value on an issue or unite request
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, number, field_id, value]
              properties:
                kind: { type: string, enum: [issue, pull] }
                number: { type: integer }
                field_id: { type: string }
                value: { type: string, description: Empty clears the value }
      responses:
        "200": { description: Saved value }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/board:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    put:
      summary: Add a unite request to the board or move it; its state never changes
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  {
                    type: string,
                    description: A column key; empty uses the first column,
                  }
      responses:
        "200": { description: Saved status }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a unite request from the board
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /districts/{slug}/board:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      security: []
      summary: Combined board for every district repository the viewer can read
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        "200":
          description: Merged columns and board items
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items: { $ref: "#/components/schemas/BoardColumn" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BoardItem" }
                  total: { type: integer }
  /repos/{owner}/{repo}/issues/{number}/board:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
    put:
      summary: Move an issue between board columns; the done column closes it
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: A column key }
      responses:
        "200":
          description: Saved board status and issue state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  state: { type: string, enum: [open, closed] }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/comments:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List up to 200 issue comments visible to repository readers
      responses:
        "200":
          description: Chronological issue discussion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueComment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a comment as an authenticated repository reader
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueComment" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/labels:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List repository labels
      responses:
        "200":
          description: Labels ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
    post:
      summary: Create a repository label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                color: { type: string, pattern: "^#?[0-9a-fA-F]{6}$" }
                description: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/labels/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      summary: Delete a repository label and its issue assignments
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/labels:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List labels assigned to an issue
      responses:
        "200":
          description: Assigned labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
    post:
      summary: Assign a label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_id]
              properties:
                label_id: { type: string, format: uuid }
      responses:
        "200":
          description: Assigned label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/labels/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
        {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    delete:
      summary: Remove an assigned issue label with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      security: []
      summary: List up to 100 pull requests
      responses:
        "200":
          description: Pull requests, newest first
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Pull" } }
    post:
      summary: Open a same-repository pull request (owner only)
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, base_branch, head_branch]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                base_branch: { type: string }
                head_branch: { type: string }
      responses:
        "201":
          description: Pull request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read current pull request, diff, and mergeability
      responses:
        "200":
          description: Comparison snapshot; send its SHAs when merging
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull: { $ref: "#/components/schemas/Pull" }
                  head_sha: { type: string }
                  base_sha: { type: string }
                  diff: { type: string }
                  diff_error: { type: string }
                  mergeable: { type: boolean }
                  can_review: { type: boolean }
    patch:
      summary: Close or reopen a pull request with triage permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: Updated pull request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/merge:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    post:
      summary: Merge, squash, or rebase a ready Unite request, or resume a persisted merge intent
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [head_sha, base_sha]
              properties:
                head_sha: { type: string }
                base_sha: { type: string }
                method: { type: string, enum: [merge, squash, rebase] }
                delete_branch: { type: boolean }
      responses:
        "200":
          description: Merged pull request; retries of already merged requests are idempotent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pull" }
        "409": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/subscription:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: Read whether the current user follows a Unite request
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Follow or unfollow a Unite request
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscribed]
              properties:
                subscribed: { type: boolean }
      responses:
        "200":
          description: Updated subscription state
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/comments:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List up to 200 pull-request comments visible to repository readers
      responses:
        "200":
          description: Chronological pull-request discussion
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PullComment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a comment as an authenticated repository reader
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullComment" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/pulls/{number}/reviews:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { $ref: "#/components/parameters/Number" },
      ]
    get:
      security: []
      summary: List formal reviews and whether each targets an outdated head
      responses:
        "200":
          description: Chronological formal reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    state:
                      {
                        type: string,
                        enum: [approved, changes_requested, commented],
                      }
                    body: { type: string }
                    reviewer: { type: string }
                    head_sha: { type: string }
                    stale: { type: boolean }
                    created_at: { type: string, format: date-time }
    post:
      summary: Submit a commit-bound formal review with write permission
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, body, head_sha]
              properties:
                state:
                  {
                    type: string,
                    enum: [approved, changes_requested, commented],
                  }
                body: { type: string, maxLength: 10000 }
                head_sha: { type: string, minLength: 40, maxLength: 40 }
      responses:
        "201": { description: Formal review submitted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /user/oauth-apps:
    get:
      summary: List OAuth applications this account has registered
      responses:
        "200": { description: OAuth applications }
    post:
      summary: Register a new OAuth application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uri]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                homepage_url: { type: string, maxLength: 300 }
                redirect_uri: { type: string, maxLength: 500 }
      responses:
        "201":
          description: OAuth application registered, with client_secret shown once
        "422": { $ref: "#/components/responses/Error" }
  /user/oauth-apps/{id}/secret:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Regenerate an OAuth application's client secret
      responses:
        "200": { description: New client_secret, shown once }
        "404": { $ref: "#/components/responses/Error" }
  /user/oauth-apps/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Delete an OAuth application
      responses:
        "200": { description: OAuth application deleted }
        "404": { $ref: "#/components/responses/Error" }
  /oauth/authorize:
    get:
      summary: Fetch the consent-screen details for a pending authorization
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          { description: Application name, description, and requested scope }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Approve or deny an authorization request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, scope, approve]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                scope: { type: string }
                state: { type: string }
                approve: { type: boolean }
      responses:
        "200":
          description: The exact redirect_to URL the browser should navigate to next
        "422": { $ref: "#/components/responses/Error" }
  /oauth/token:
    post:
      summary: >-
        Exchange an authorization code, or a refresh token, for an access
        token. Called directly by a third-party client — form-encoded, no
        Origin header, unlike every other mutating endpoint in this API.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                client_secret: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
      responses:
        "200": { description: access_token, refresh_token, scope, expires_in }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /user/authorized-apps:
    get:
      summary: List OAuth applications this account has authorized
      responses:
        "200": { description: Authorized applications and their granted scope }
  /user/authorized-apps/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: >-
        Revoke an OAuth application's access. Deletes every token issued
        under the grant immediately, not just at its next expiry.
      responses:
        "200": { description: Authorization revoked }
        "404": { $ref: "#/components/responses/Error" }
  /user/gitown-apps:
    get:
      summary: List GITOWN Apps this account has registered
      responses:
        "200": { description: GITOWN Apps }
    post:
      summary: >-
        Register a GITOWN App. Creates a synthetic bot-user identity for the
        app; installing it on a repository grants that bot user a role
        scoped to exactly that repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, requested_scope]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                homepage_url: { type: string, maxLength: 300 }
                webhook_url: { type: string, maxLength: 2000 }
                requested_scope:
                  { type: string, enum: ["repo:read", "repo:write"] }
      responses:
        "201": { description: GITOWN App registered }
        "422": { $ref: "#/components/responses/Error" }
  /user/gitown-apps/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: >-
        Delete a GITOWN App. Deletes its bot user, every installation, and
        every token it holds.
      responses:
        "200": { description: GITOWN App deleted }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/gitown-apps:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
      ]
    get:
      summary: List GITOWN Apps installed on this repository
      responses:
        "200": { description: Installations }
    post:
      summary: >-
        Install a GITOWN App on this repository, granting its bot user a
        role scoped to only this repository. The granted scope may not
        exceed what the app itself requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, description: "The GITOWN App's id." }
                scope: { type: string, enum: ["repo:read", "repo:write"] }
      responses:
        "201":
          description: >-
            Installed, with installation_token shown once — a long-lived
            token scoped only to this repository and the granted role.
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/gitown-apps/{id}:
    parameters:
      [
        { $ref: "#/components/parameters/Owner" },
        { $ref: "#/components/parameters/Repo" },
        { name: id, in: path, required: true, schema: { type: string } },
      ]
    delete:
      summary: >-
        Uninstall a GITOWN App, revoking its installation token immediately
        and removing its bot user's access to this repository.
      responses:
        "200": { description: Uninstalled }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: gitown_session }
    token:
      {
        type: http,
        scheme: bearer,
        description: "Personal access token (gtn_...) where an endpoint accepts one",
      }
  parameters:
    Origin:
      {
        name: Origin,
        in: header,
        required: true,
        schema: { type: string },
        description: Exact configured frontend origin,
      }
    Owner: { name: owner, in: path, required: true, schema: { type: string } }
    Repo: { name: repo, in: path, required: true, schema: { type: string } }
    Number:
      {
        name: number,
        in: path,
        required: true,
        schema: { type: integer, minimum: 1 },
      }
  requestBodies:
    Content:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              body: { type: string, maxLength: 20000 }
  responses:
    OK:
      description: Operation completed
      content:
        application/json:
          schema: { type: object, properties: { ok: { type: boolean } } }
    Session:
      description: User and new session cookie
      headers:
        Set-Cookie:
          {
            schema: { type: string },
            description: HttpOnly,
            SameSite=Lax; Secure for HTTPS origins,
          }
      content:
        application/json:
          schema:
            {
              type: object,
              properties: { user: { $ref: "#/components/schemas/User" } },
            }
    Error:
      description: Safe error with a stable code; all endpoints may also return 400, 401, 403, or 500
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    BuilderSearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BuilderResult" }
        has_more: { type: boolean }
    BuilderResult:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        location: { type: string }
        skills: { type: string }
        availability: { type: string }
        followers: { type: integer, minimum: 0 }
        repositories: { type: integer, minimum: 0 }
        open_to_collaborators: { type: boolean }
    FollowList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              display_name: { type: string }
              bio: { type: string }
        has_more: { type: boolean }
    ProfileLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        url: { type: string, maxLength: 300, description: HTTPS URL }
    Screenshot:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 300, description: HTTPS image URL }
        caption: { type: string, maxLength: 140 }
    RepositoryWatch:
      type: object
      properties:
        mode: { type: string, enum: [watching, participating, ignoring, ""] }
        implicit: { type: boolean }
    Showcase:
      type: object
      properties:
        repository: { type: object }
        readme: { type: string }
        setup: { type: string }
        screenshots:
          type: array
          items: { $ref: "#/components/schemas/Screenshot" }
        stack: { type: array, items: { type: string } }
        sparks: { type: integer }
        contributors:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              display_name: { type: string }
              merged: { type: integer }
              role: { type: string, enum: [owner, contributor] }
        latest_drop:
          type: [object, "null"]
          properties:
            tag: { type: string }
            title: { type: string }
            downloads: { type: integer }
            created_at: { type: string, format: date-time }
        roadmap:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              due_date: { type: [string, "null"], format: date }
              open_issues: { type: integer }
              closed_issues: { type: integer }
        tasks:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              title: { type: string }
              labels: { type: array, items: { type: string } }
    WorkSearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [issue, unite] }
              owner: { type: string }
              repository: { type: string }
              number: { type: integer }
              title: { type: string }
              preview: { type: string }
              state: { type: string }
        has_more: { type: boolean }
    RepositorySearch:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        has_more: { type: boolean }
    SparkState:
      type: object
      required: [count, sparked]
      properties:
        count: { type: integer, minimum: 0 }
        sparked: { type: boolean }
    TopicState:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    Repository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, private] }
        default_branch: { type: string }
        created_at: { type: string, format: date-time }
        can_write: { type: boolean }
        can_triage: { type: boolean }
        can_manage: { type: boolean }
        can_maintain: { type: boolean }
        can_comment: { type: boolean }
        archived: { type: boolean }
        role:
          type: string
          enum: [owner, maintain, write, triage, read]
        clone_url: { type: string, format: uri }
    RepositoryRole:
      type: string
      enum: [maintain, write, triage, read]
    RepositoryMember:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        created_at: { type: string, format: date-time }
    DeployKey:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        fingerprint: { type: string }
        write: { type: boolean }
        created_at: { type: string, format: date-time }
        authorized_keys:
          type: string
          description: Present only in the create response.
    RefEvent:
      type: object
      properties:
        ref: { type: string }
        old_sha: { type: string }
        new_sha: { type: string }
        via: { type: string, enum: [https, ssh, api] }
        actor: { type: string, description: Empty when the actor is unknown. }
        created_at: { type: string, format: date-time }
    WebhookEvent:
      type: string
      enum:
        [
          push,
          issue.opened,
          issue.closed,
          issue.reopened,
          issue.commented,
          pull.opened,
          pull.closed,
          pull.reopened,
          pull.merged,
          pull.reviewed,
          pull.commented,
          drop.published,
          app.installed,
          app.uninstalled,
        ]
    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        active: { type: boolean }
        kind: { type: string, enum: ["generic", "slack", "discord"] }
        created_at: { type: string, format: date-time }
        secret:
          type: string
          description: >
            Present only in the create response, or an update response that
            regenerated it. Never returned by any later read — verify
            deliveries against the value shown then.
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        event: { type: string }
        status: { type: string, enum: [pending, sending, success, failed] }
        attempts: { type: integer }
        response_status: { type: integer, nullable: true }
        response_body: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
    BranchRule:
      type: object
      properties:
        branch: { type: string }
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        block_changes_requested: { type: boolean }
        require_unite: { type: boolean }
        require_resolved: { type: boolean }
        require_up_to_date: { type: boolean }
        restrict_push: { type: boolean }
        require_signed: { type: boolean }
        require_maintainer_approval: { type: boolean }
        required_checks: { type: array, items: { type: string } }
        required_reviewers: { type: array, items: { type: string } }
        allow_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        updated_at: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        repository: { type: string }
        email: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/RepositoryRole" }
        status:
          {
            type: string,
            enum: [pending, accepted, declined, expired, revoked],
          }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accept_url:
          {
            type: string,
            format: uri,
            description: Present only when an email-only invitation is created,
          }
    DeletedRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        deleted_at: { type: string, format: date-time }
        purge_after: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: ["repo:read", "repo:write"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BrowserSession:
      type: object
      properties:
        id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PublicRepository:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        homepage: { type: string }
        stack: { type: string }
        sparks: { type: integer, minimum: 0 }
        latest_drop: { type: string }
        downloads: { type: integer, minimum: 0 }
    Profile:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        bio: { type: string }
        website: { type: string }
        location: { type: string }
        skills: { type: string, maxLength: 200 }
        skill_tags: { type: array, items: { type: string } }
        availability: { type: string, maxLength: 200 }
        open_to_collaborators: { type: boolean }
        links:
          type: array
          items: { $ref: "#/components/schemas/ProfileLink" }
        contributions:
          type: object
          description: Public work that helped something ship; Sparks are not counted
          properties:
            merged_unites: { type: integer, minimum: 0 }
            approvals: { type: integer, minimum: 0 }
            reviews: { type: integer, minimum: 0 }
            helped_ship: { type: integer, minimum: 0 }
            closed_issues: { type: integer, minimum: 0 }
            resolved_issues: { type: integer, minimum: 0 }
            pushes: { type: integer, minimum: 0 }
            docs_unites: { type: integer, minimum: 0 }
            external_merges: { type: integer, minimum: 0 }
            public_repositories: { type: integer, minimum: 0 }
        badges:
          type: array
          items:
            type: object
            properties:
              id:
                {
                  type: string,
                  enum: [merged, reviewer, resolver, documentarian, maintainer],
                }
              label: { type: string }
              tier: { type: string, enum: [bronze, silver, gold] }
              reason: { type: string }
        created_at: { type: string, format: date-time }
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
        followed: { type: boolean }
        showcase:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
        repositories:
          type: array
          items: { $ref: "#/components/schemas/PublicRepository" }
    IssueFormField:
      type: object
      required: [id, label, type]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
        label: { type: string, maxLength: 100 }
        type: { type: string, enum: [text, textarea, dropdown, checkbox] }
        required: { type: boolean }
        options: { type: array, items: { type: string }, maxItems: 20 }
    IssueTemplate:
      type: object
      required: [name, title, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
        kind: { type: string, enum: [bug, feature, custom] }
        fields:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/IssueFormField" }
        builtin: { type: boolean, readOnly: true }
    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        state_reason:
          { type: string, enum: ["", completed, not_planned, duplicate] }
        author: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pinned: { type: boolean }
        priority: { type: string }
        iteration: { type: string }
        estimate: { type: [integer, "null"] }
        due_date: { type: [string, "null"], format: date-time }
        duplicate_of: { type: [integer, "null"] }
        parent: { type: [integer, "null"] }
        milestone: { type: [string, "null"] }
        labels:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              color: { type: string }
        assignees: { type: array, items: { type: string } }
        comments: { type: integer }
        sub_issues:
          type: object
          properties:
            total: { type: integer }
            closed: { type: integer }
    SubIssues:
      type: object
      properties:
        parent:
          oneOf:
            - { $ref: "#/components/schemas/LinkedIssue" }
            - { type: "null" }
        children:
          type: array
          items: { $ref: "#/components/schemas/LinkedIssue" }
        total: { type: integer }
        closed: { type: integer }
    IssueReference:
      type: object
      properties:
        kind: { type: string, enum: [issue, pull] }
        owner: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string }
        state: { type: string }
    IssueReferences:
      type: object
      properties:
        mentions:
          type: array
          items: { $ref: "#/components/schemas/IssueReference" }
        referenced_by:
          type: array
          items: { $ref: "#/components/schemas/IssueReference" }
    SavedSearch:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        query: { type: string }
        created_at: { type: string, format: date-time }
    IssueComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        edited: { type: boolean }
        editable:
          {
            type: boolean,
            description: Whether the signed-in viewer can edit this comment,
          }
    PublicUser:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
    LinkedIssue:
      type: object
      properties:
        number: { type: integer }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
    IssueDependencies:
      type: object
      properties:
        blocked_by:
          type: array
          items: { $ref: "#/components/schemas/LinkedIssue" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/LinkedIssue" }
    IssueAssignees:
      type: object
      properties:
        assigned:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
        available:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
    IssueSubscription:
      type: object
      properties:
        subscribed: { type: boolean }
    FeedEvent:
      type: object
      properties:
        kind:
          {
            type: string,
            enum:
              [
                repository_created,
                repository_sparked,
                issue_opened,
                unite_opened,
              ],
          }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind:
          {
            type: string,
            enum:
              [
                issue_opened,
                issue_comment,
                issue_closed,
                issue_reopened,
                pull_opened,
                pull_comment,
                pull_review,
                pull_closed,
                pull_reopened,
                pull_merged,
                mention,
                assignment,
                review_request,
                invitation,
                ownership_transfer,
                check_success,
                check_failure,
                follow,
              ],
          }
        actor: { type: string }
        owner: { type: string }
        repository: { type: string }
        issue: { type: [integer, "null"] }
        pull: { type: [integer, "null"] }
        title: { type: string }
        excerpt: { type: string, maxLength: 280 }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    Milestone:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        state: { type: string, enum: [open, closed] }
        due_date: { type: [string, "null"], format: date }
        open_issues: { type: integer }
        closed_issues: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardItem:
      type: object
      properties:
        kind: { type: string, enum: [issue, pull] }
        item_id: { type: string, format: uuid }
        issue_id: { type: string, format: uuid }
        pull_id: { type: string, format: uuid }
        owner: { type: string }
        repository: { type: string }
        number: { type: integer }
        title: { type: string }
        state: { type: string }
        status: { type: string, description: A column key }
        author: { type: string }
        priority: { type: string }
        iteration: { type: string }
        pinned: { type: boolean }
        estimate: { type: [integer, "null"] }
        due_date: { type: [string, "null"], format: date-time }
        milestone: { type: [string, "null"] }
        milestone_due: { type: [string, "null"], format: date-time }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Custom field values keyed by field ID
    BoardColumn:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,29}$" }
        name: { type: string, maxLength: 30 }
    BoardField:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [text, number, date, single_select] }
        options: { type: array, items: { type: string } }
        position: { type: integer }
    BoardSettings:
      type: object
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/BoardColumn" }
        automation: { type: boolean }
        fields:
          type: array
          items: { $ref: "#/components/schemas/BoardField" }
    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^[0-9a-f]{6}$" }
        description: { type: string }
        created_at: { type: string, format: date-time }
    Pull:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed, merging, merged] }
        author: { type: string }
        created_at: { type: string, format: date-time }
        base_branch: { type: string }
        head_branch: { type: string }
        merge_sha: { type: [string, "null"] }
        branch_deleted:
          {
            type: boolean,
            description: Present in a merge response when source-branch deletion was requested,
          }
        branch_delete_error:
          { type: string, description: Why the source branch was kept }
    PullComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
