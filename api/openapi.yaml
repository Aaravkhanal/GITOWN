      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string }
      responses:
        "200":
          description: Updated assignment choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueAssignees" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{owner}/{repo}/issues/{number}/subscription:
    parameters:
      - { $ref: "#/components/parameters/Owner" }
      - { $ref: "#/components/parameters/Repo" }
      - { $ref: "#/components/parameters/Number" }
