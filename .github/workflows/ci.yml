name: GITOWN checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # ubuntu-latest currently ships PostgreSQL 16 client tools. Keep the
        # service on the same major version so the real backup/restore drill
        # is valid instead of failing pg_dump's safety check.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitown
          POSTGRES_PASSWORD: gitown-ci-only
          POSTGRES_DB: gitown
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gitown -d gitown"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gitown:gitown-ci-only@127.0.0.1:5432/gitown?sslmode=disable
      TEST_DATABASE_URL: postgres://gitown:gitown-ci-only@127.0.0.1:5432/gitown?sslmode=disable
      GITOWN_WEB_PORT: "3101"
      GITOWN_API_PORT: "8181"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Deployment configuration preflight
        run: node scripts/deployment-check.mjs --config
        env:
          GITOWN_ORIGIN: https://gitown.example
          GITOWN_GIT_URL: https://gitown.example/git
          GITOWN_SECRET_KEY: ci-only-not-a-real-secret-with-32-bytes
          GITOWN_OPERATORS: ci-operator
          GITOWN_ALLOW_SIGNUP: "false"
      - name: Validate Compose deployment configuration
        run: |
          docker compose config --quiet
          docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-compose-validation
      - name: Test Go and Git workflows
        run: go test -race ./...
      - run: go vet ./...
      - run: npm run test:operations
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          npm run dev > /tmp/gitown-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3101/api/v1/auth/me || true)
            # This endpoint is expected to return 401 without a session. That
            # still proves the web proxy and API/database are ready; curl
            # --fail incorrectly treated it as not-ready and waited the full
            # startup budget on every successful boot.
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "GITOWN did not become ready; recent server output follows:"
            tail -n 120 /tmp/gitown-dev.log || true
            exit 1
          fi
          DATABASE_URL="$DATABASE_URL" \
          GITOWN_ADDR=127.0.0.1:8182 \
          GITOWN_ORIGIN=http://localhost:3101 \
          GITOWN_GIT_URL=http://localhost:8182/git \
          GITOWN_DATA_DIR="$PWD/.data/repositories" \
          GITOWN_SECRET_KEY=ci-only-not-a-real-secret-with-32-bytes \
          GITOWN_OPERATORS=ci-operator \
          ./.tools/gitown > /tmp/gitown-api-2.log 2>&1 &
          api2_pid=$!
          trap 'kill "$api2_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8182/readyz || true)
            if [ "$status" = "200" ]; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "Second GITOWN API instance did not become ready; recent output follows:"
            tail -n 80 /tmp/gitown-api-2.log || true
            exit 1
          fi
          GITOWN_DEPLOY_URL=http://127.0.0.1:8181 node scripts/deployment-check.mjs --health
          GITOWN_LOAD_TEST_CONFIRM_DISPOSABLE=true \
          GITOWN_LOAD_TEST_URLS=http://127.0.0.1:8181,http://127.0.0.1:8182 \
          GITOWN_LOAD_TEST_REQUESTS=90 \
          GITOWN_LOAD_TEST_CONCURRENCY=10 \
          GITOWN_LOAD_TEST_P95_LIMIT_MS=5000 \
          node scripts/load-check.mjs
          npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitown-test-results
          path: |
            test-results
            /tmp/gitown-dev.log
            /tmp/gitown-api-2.log
