name: Signed CLI releases
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - name: Build portable CLI archives
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="gitown_${GITHUB_REF_NAME#v}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/Aaravkhanal/GITOWN/internal/version.Version=${GITHUB_REF_NAME#v}" -o "dist/$name/gitown" ./apps/gitown
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          cosign sign-blob --yes --bundle dist/checksums.bundle dist/checksums.txt
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/checksums.bundle --generate-notes
